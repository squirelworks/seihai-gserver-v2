# Seihai: build gs2emu for Linux, Windows and macOS. A tag push (v*), or a manual
# run with a version, also makes a DRAFT GitHub release with the four archives and
# the full source, as the GPL asks. The tag is made when the owner presses Publish.
# Modified by the Seihai project, 2026-11-04: see CHANGES-SEIHAI.md.
name: Seihai build and release

on:
  push:
    branches: [seihai]
    tags: ['v*']
  pull_request:
    branches: [seihai]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to draft, without the v (e.g. 4.0.0-seihai.1). Leave empty to build only.'
        required: false
        default: ''
      skip_macos:
        description: 'Leave out the two macOS builds (when GitHub has no macOS runners). Run again without it later to add them to the same draft.'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # skip_macos (manual runs only) leaves out the macOS rows; a tag push builds all four.
      matrix:
        include: ${{ fromJSON(inputs.skip_macos && '[{"os":"ubuntu-24.04","name":"seihai-gserver-v2-linux-x86_64","triplet":"x64-linux"},{"os":"windows-latest","name":"seihai-gserver-v2-windows-x86_64","triplet":"x64-windows-static"}]' || '[{"os":"ubuntu-24.04","name":"seihai-gserver-v2-linux-x86_64","triplet":"x64-linux"},{"os":"windows-latest","name":"seihai-gserver-v2-windows-x86_64","triplet":"x64-windows-static"},{"os":"macos-15-intel","name":"seihai-gserver-v2-macos-x86_64","triplet":"x64-osx"},{"os":"macos-15","name":"seihai-gserver-v2-macos-aarch64","triplet":"arm64-osx"}]') }}
    runs-on: ${{ matrix.os }}
    env:
      # Not VCPKG_ROOT: the MSVC developer prompt overwrites that one.
      VCPKG_DIR: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-14 g++-14 ninja-build autoconf automake libtool bison flex
      - name: macOS tools
        if: runner.os == 'macOS'
        run: brew install ninja llvm lld autoconf automake libtool bison flex
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_DIR"
          if [ "$RUNNER_OS" = Windows ]; then "$VCPKG_DIR/bootstrap-vcpkg.bat" -disableMetrics; else "$VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics; fi
      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = Linux ]; then export CC=gcc-14 CXX=g++-14; fi
          if [ "$RUNNER_OS" = macOS ]; then
            LLVM="$(brew --prefix llvm)"; export CC="$LLVM/bin/clang" CXX="$LLVM/bin/clang++"
            export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
            # Link with Homebrew's lld: Apple's ld rejects the GNU-format archives llvm-ar
            # writes and cannot read LLVM 23 LTO bitcode.
            EXTRA="-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=$(brew --prefix lld)/bin/ld64.lld"
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTESTS=OFF -DUPNP=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_DIR/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} $EXTRA
      - name: Build
        run: cmake --build build
      # Seihai regression tests that are kept building. Linux only; the other test
      # folders under Catch_tests are upstream's and are not built here.
      - name: Regression tests
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -DTESTS=ON
          cmake --build build --target RC
          timeout 60 bin/RC
          rm -f bin/RC
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.name }}
          cp -r bin/. dist/${{ matrix.name }}/
          cp LICENSE.md CHANGES-SEIHAI.md README.md dist/${{ matrix.name }}/
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then 7z a ${{ matrix.name }}.zip ${{ matrix.name }}; else tar czf ${{ matrix.name }}.tar.gz ${{ matrix.name }}; fi
      # Start both packaged lab servers (after the archive is made, so the run's logs
      # and accounts stay out of it) and check both listen on 127.0.0.1.
      - name: Lab world smoke test
        shell: bash
        run: |
          cd dist/${{ matrix.name }}
          exe=./gs2emu; [ "$RUNNER_OS" = Windows ] && exe=./gs2emu.exe
          "$exe" --server default > default.out 2>&1 & p1=$!
          "$exe" --server classic > classic.out 2>&1 & p2=$!
          ok=1
          for port in 14802 14803; do
            up=0
            for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null && { up=1; break; }; sleep 1; done
            [ $up = 1 ] || { echo "nothing listens on 127.0.0.1:$port"; ok=0; }
          done
          # wait returns the killed server's status (143 on Windows, where kill is TerminateProcess);
          # with bash -e that ended the step before the logs were printed.
          kill $p1 $p2 2>/dev/null || true; wait $p1 $p2 2>/dev/null || true
          if [ "$RUNNER_OS" = Windows ]; then taskkill //F //IM gs2emu.exe > /dev/null 2>&1 || true; fi
          for s in default classic; do echo "== $s"; tail -n 20 $s.out; done
          [ $ok = 1 ]
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then TAG="v$INPUT_VERSION"; else TAG="$GITHUB_REF_NAME"; fi
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "::error::bad version $TAG"; exit 1; }
          # Hand-written notes, reviewed in a PR.
          NOTES="docs/releases/$TAG.md"
          [ -f "$NOTES" ] || { echo "::error::No release notes: write $NOTES in a PR first"; exit 1; }
          git archive --format=tar.gz --prefix=seihai-gserver-v2-$TAG/ -o dist/seihai-gserver-v2-$TAG-source.tar.gz HEAD
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = true ]; then
              gh release upload "$TAG" dist/* --clobber
              gh release edit "$TAG" --target "$GITHUB_SHA" --notes-file "$NOTES"
            else
              echo "$TAG is already published; leaving it as it is."
            fi
          else
            gh release create "$TAG" dist/* --draft --target "$GITHUB_SHA" --title "Seihai GServer-v2 $TAG" --notes-file "$NOTES"
          fi
          echo "Draft: $(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
