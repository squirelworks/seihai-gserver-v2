# Seihai project, 2026-11-21: see CHANGES-SEIHAI.md.
# Fails on lab machine and VM names, personal home paths and image-relative code
# addresses in tracked text (.github/scripts/check_lab_leaks.py, shared across
# the Seihai suite). No paths filter: a leak can land in any file.
name: lab-leak-check

on:
  push:
    branches: [seihai]
  pull_request:
    branches: [seihai]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Lab machine and VM names, home paths and image-relative code addresses
  # (.github/scripts/check_lab_leaks.py, shared across the Seihai suite).
  lab-leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No lab names, home paths or binary addresses
        run: python3 .github/scripts/check_lab_leaks.py
